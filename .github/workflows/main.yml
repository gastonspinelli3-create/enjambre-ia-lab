
name: Experimento Enjambre IA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experimento:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar enjambre
        run: |
          echo "Investigar oportunidades de infraestructura para centros de datos" | python enjambre.py
          

      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-enjambre
          path: |
            *.json
            resultados/
          if-no-files-found: warn
          
